<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EVA Dance Company — Live Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px;
      background: #f5f3f7;
      color: #28232c;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 520px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 { font-size: 25px; }

    .panel {
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 3px 15px #20102a12;
    }

    #status {
      padding: 12px;
      border-radius: 9px;
      background: #ece8f1;
      color: #4d365b;
      line-height: 1.45;
      margin-bottom: 14px;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
    }

    button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #59366f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.stop {
      background: #5c5960;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #message {
      display: none;
      position: fixed;
      z-index: 10;
      left: 5%;
      top: 35%;
      width: 90%;
      max-width: 460px;
      padding: 24px 18px;
      border-radius: 16px;
      box-shadow: 0 8px 35px #0004;
      text-align: center;
      white-space: pre-line;
      overflow-wrap: anywhere;
      font-size: 19px;
      font-weight: bold;
    }

    #message.success {
      display: block;
      background: #e4f7e8;
      color: #175b2a;
    }

    #message.warning {
      display: block;
      background: #fff0d0;
      color: #744b00;
    }

    #message.error {
      display: block;
      background: #fde8e8;
      color: #8c2020;
    }

    .hint {
      color: #77717e;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>EVA Dance Company</h1>
      <p>Live ticket check-in</p>
    </header>

    <section class="panel">
      <div id="status" role="status" aria-live="polite">
        Ready to start. Open this page from the staff check-in page.
      </div>

      <div id="reader"></div>

      <button id="startButton" type="button">
        Ready to Scan
      </button>

      <button id="stopButton" class="stop" type="button" hidden>
        Stop Scanner
      </button>

      <p class="hint">
        Keep this page open during check-in. After each scan, the
        result appears here and the camera resumes automatically.
      </p>
    </section>
  </main>

  <div id="message" role="alert" aria-live="assertive"></div>

  <script>
    'use strict';

    const STAFF_ORIGIN = 'https://honeyxmilk.github.io';

    const statusBox = document.getElementById('status');
    const messageBox = document.getElementById('message');
    const startButton = document.getElementById('startButton');
    const stopButton = document.getElementById('stopButton');

    let scanner = null;
    let cameraRunning = false;
    let processing = false;
    let pendingTicketID = null;
    let messageTimer = null;
    let scanTimeout = null;

    function setStatus(text) {
      statusBox.textContent = text;
    }

    function showMessage(text, type) {
      clearTimeout(messageTimer);
      messageBox.className = type;
      messageBox.textContent = text;
      messageBox.style.display = 'block';

      messageTimer = setTimeout(function() {
        messageBox.style.display = 'none';
        messageBox.className = '';
      }, 2200);
    }

    function hideMessage() {
      clearTimeout(messageTimer);
      messageBox.style.display = 'none';
      messageBox.className = '';
    }

    function extractTicketID(text) {
      const raw = String(text || '').trim();

      try {
        const url = new URL(raw);
        const ticket = url.searchParams.get('ticket');
        if (ticket) return ticket.trim();
      } catch (error) {
        // QR content may be a plain ticket ID.
      }

      return raw;
    }

    function isValidTicketID(id) {
      return /^[A-Za-z0-9_-]{1,100}$/.test(id);
    }

    function onScanSuccess(decodedText) {
      if (processing || !cameraRunning) return;

      const ticketID = extractTicketID(decodedText);

      if (!isValidTicketID(ticketID)) {
        showMessage('Unrecognized ticket QR code', 'error');
        return;
      }

      if (!window.opener || window.opener.closed) {
        showMessage(
          'Staff page is no longer connected. Close this page and reopen the scanner from the staff page.',
          'error'
        );
        setStatus('Staff page connection lost.');
        return;
      }

      processing = true;
      pendingTicketID = ticketID;

      try {
        scanner.pause(true);
      } catch (error) {}

      setStatus('Checking ticket ' + ticketID + '…');

      // Send the ticket ID to the staff Apps Script page.
      window.opener.postMessage({
        type: 'TICKET_SCANNED',
        ticketID: ticketID
      }, '*');

      clearTimeout(scanTimeout);

      scanTimeout = setTimeout(function() {
        if (processing && pendingTicketID === ticketID) {
          processing = false;
          pendingTicketID = null;

          showMessage(
            'No response from the staff page. Please try scanning again.',
            'error'
          );

          setStatus('Waiting for the next scan.');
          resumeCamera();
        }
      }, 15000);
    }

    function resumeCamera() {
      if (!scanner || !cameraRunning) return;

      setTimeout(function() {
        if (!cameraRunning || processing) return;

        try {
          scanner.resume();
          setStatus('Camera active. Ready for the next ticket.');
        } catch (error) {
          setStatus('Unable to resume camera. Please stop and restart it.');
        }
      }, 900);
    }

    function isGoogleOrigin(origin) {
      return origin === 'https://script.google.com' ||
        origin === 'https://script.googleusercontent.com' ||
        (
          origin.startsWith('https://') &&
          origin.endsWith('.script.googleusercontent.com')
        );
    }

    // Receive the check-in result from the Apps Script staff page.
    window.addEventListener('message', function(event) {
      if (event.source !== window.opener) return;
      if (!isGoogleOrigin(event.origin)) return;

      const data = event.data;

      if (!data || data.type !== 'CHECKIN_RESULT') return;

      if (
        !processing ||
        String(data.ticketID || '') !== pendingTicketID
      ) {
        return;
      }

      clearTimeout(scanTimeout);

      const ticketID = pendingTicketID;
      processing = false;
      pendingTicketID = null;

      switch (String(data.result || '')) {
        case 'success':
          showMessage(
            '✓ SUCCESSFULLY CHECKED IN\n' + ticketID,
            'success'
          );
          setStatus('Check-in successful. Ready for the next ticket.');
          break;

        case 'already':
          showMessage(
            '⚠ ALREADY CHECKED IN\n' + ticketID,
            'warning'
          );
          setStatus('Ticket was previously checked in.');
          break;

        case 'invalid':
          showMessage(
            '✕ INVALID TICKET\n' + ticketID,
            'error'
          );
          setStatus('Ticket is not valid for check-in.');
          break;

        case 'not_found':
          showMessage(
            '✕ TICKET NOT FOUND\n' + ticketID,
            'error'
          );
          setStatus('No matching ticket was found.');
          break;

        case 'busy':
          showMessage(
            'Please try scanning this ticket again.',
            'warning'
          );
          setStatus('Check-in system is busy.');
          break;

        default:
          showMessage(
            'Could not verify ticket.\n' +
              (data.message || 'Please try again.'),
            'error'
          );
          setStatus('Check-in failed. Ready to retry.');
          break;
      }

      // Keep the camera running and resume after the result.
      resumeCamera();
    });

    async function startScanner() {
      if (cameraRunning) return;

      if (!window.opener || window.opener.closed) {
        showMessage(
          'Please open this scanner from the staff check-in page.',
          'error'
        );
        return;
      }

      if (typeof Html5Qrcode === 'undefined') {
        showMessage(
          'Scanner library failed to load. Check your internet connection.',
          'error'
        );
        return;
      }

      startButton.disabled = true;
      startButton.textContent = 'Starting camera…';

      try {
        if (!scanner) {
          scanner = new Html5Qrcode('reader');
        }

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: function(width, height) {
              const size = Math.floor(
                Math.min(width, height) * 0.72
              );
              return { width: size, height: size };
            },
            aspectRatio: 1
          },
          onScanSuccess,
          function() {
            // Ignore normal frames without a QR code.
          }
        );

        cameraRunning = true;
        startButton.hidden = true;
        stopButton.hidden = false;

        setStatus('Camera active. Ready to scan a ticket.');

      } catch (error) {
        console.error(error);
        startButton.disabled = false;
        startButton.textContent = 'Try Camera Again';

        showMessage(
          'Could not start camera. Check browser camera permissions and try again.',
          'error'
        );
      }
    }

    async function stopScanner() {
      cameraRunning = false;
      processing = false;
      pendingTicketID = null;

      clearTimeout(scanTimeout);
      hideMessage();

      if (scanner) {
        try {
          await scanner.stop();
        } catch (error) {
          console.warn('Camera stop:', error);
        }
      }

      startButton.hidden = false;
      startButton.disabled = false;
      startButton.textContent = 'Ready to Scan';
      stopButton.hidden = true;

      setStatus('Scanner stopped.');
    }

    startButton.addEventListener('click', startScanner);
    stopButton.addEventListener('click', stopScanner);

    window.addEventListener('beforeunload', function() {
      if (scanner && cameraRunning) {
        scanner.stop().catch(function() {});
      }
    });
  </script>
</body>
</html>
