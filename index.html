<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Ticket Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px;
      background: #f5f6f8;
      color: #202124;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 2px 12px #00000012;
    }

    h1 { font-size: 24px; margin-top: 0; }

    p { line-height: 1.5; color: #5f6368; }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #202124;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; }

    #reader { width: 100%; margin-top: 16px; }

    #status {
      margin-top: 16px;
      padding: 12px;
      background: #f1f3f4;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    #manualResult { display: none; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Event Check-In Scanner</h1>
    <p>Point the camera at the guest's ticket QR code.</p>

    <button id="startButton" onclick="startScanner()">
      Open Live Scanner
    </button>

    <button id="stopButton" onclick="stopScanner()" disabled>
      Stop Camera
    </button>

    <div id="reader"></div>

    <div id="status" role="status">
      Ready to scan.
    </div>

    <div id="manualResult">
      <p>Scanned content:</p>
      <div id="decodedText"></div>
      <button onclick="sendAgain()">Send Scan Again</button>
    </div>
  </div>

  <script>
    let scanner = null;
    let isScanning = false;
    let lastScan = "";

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    async function startScanner() {
      if (isScanning) return;

      if (typeof Html5Qrcode === "undefined") {
        setStatus("Scanner library failed to load. Check your internet connection and reload.");
        return;
      }

      scanner = new Html5Qrcode("reader");
      document.getElementById("startButton").disabled = true;

      try {
        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 12,
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1
          },
          onScanSuccess,
          () => {}
        );

        isScanning = true;
        document.getElementById("stopButton").disabled = false;
        setStatus("Camera is active. Aim at a ticket QR code.");
      } catch (error) {
        document.getElementById("startButton").disabled = false;
        setStatus("Could not start camera. Allow camera access and open this page in your browser over HTTPS.");
      }
    }

    async function stopScanner() {
      if (scanner && isScanning) {
        try {
          await scanner.stop();
          scanner.clear();
        } catch (error) {
          console.error(error);
        }
      }

      isScanning = false;
      document.getElementById("startButton").disabled = false;
      document.getElementById("stopButton").disabled = true;
      setStatus("Camera stopped.");
    }

    async function onScanSuccess(decodedText) {
      if (!isScanning || lastScan) return;

      lastScan = decodedText;
      setStatus("QR code scanned. Sending ticket information…");

      await stopScanner();

      document.getElementById("decodedText").textContent = decodedText;
      document.getElementById("manualResult").style.display = "block";

      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(
          {
            type: "TICKET_SCANNED",
            decodedText: decodedText
          },
          "*"
        );

        setStatus("Scan sent to the check-in page. Check the guest details there.");
      } else {
        setStatus("Scan complete. Open this scanner from your check-in page to send the result back automatically.");
      }
    }

    function sendAgain() {
      if (window.opener && !window.opener.closed && lastScan) {
        window.opener.postMessage(
          {
            type: "TICKET_SCANNED",
            decodedText: lastScan
          },
          "*"
        );
        setStatus("Scan sent again to the check-in page.");
      } else {
        setStatus("No check-in page is connected. Open this scanner from that page.");
      }
    }
  </script>
</body>
</html>
