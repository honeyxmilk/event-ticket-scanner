<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EVA Dance Live Check-In</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: auto;
      padding: 18px;
      background: #f4f5f7;
      color: #202124;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 12px #0001;
    }
    h1 { margin-top: 0; font-size: 25px; }
    p { line-height: 1.45; }
    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 0;
      border-radius: 10px;
      background: #202124;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .55; }
    #reader { width: 100%; margin-top: 12px; }
    #status {
      padding: 15px;
      border-radius: 10px;
      background: #eee;
      white-space: pre-line;
      overflow-wrap: anywhere;
      font-weight: bold;
      line-height: 1.5;
    }
    .success { background: #d9f8e3 !important; color: #126333; }
    .warning { background: #fff0c2 !important; color: #754b00; }
    .error { background: #ffe0e0 !important; color: #991b1b; }
    .muted { color: #666; font-size: 13px; font-weight: normal; }
  </style>
</head>
<body>
  <main class="card">
    <h1>EVA Dance Check-In</h1>
    <p class="muted">
      Scan a ticket QR code. Valid tickets are checked in automatically.
    </p>

    <button id="startButton" onclick="startScanner()">
      Open Live Scanner
    </button>
    <button id="stopButton" onclick="stopScanner()" disabled>
      Stop Camera
    </button>

    <div id="reader"></div>

    <h3>Latest result</h3>
    <div id="status" role="status" aria-live="polite">
      Ready. Open the scanner to connect to Google Sheets.
    </div>
    <p class="muted">
      Keep this page open during check-in. Allow pop-ups and sign in to
      Google if prompted by the check-in connection.
    </p>
  </main>

  <script>
    const APP_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbyPOpu0qWl0trE2A1xLCKlMBtMIWiOwX-sn9MAA6RJMQ1MnnFFaOqC9AgGUYCqA32RA/exec';

    let scanner = null;
    let bridgeWindow = null;
    let bridgeReady = false;
    let scanning = false;
    let processing = false;
    let pendingTicketID = '';

    const statusBox = document.getElementById('status');
    const startButton = document.getElementById('startButton');
    const stopButton = document.getElementById('stopButton');

    function showStatus(message, kind = '') {
      statusBox.className = kind;
      statusBox.textContent = message;
    }

    function extractTicketID(rawText) {
      const text = String(rawText || '').trim();

      try {
        const url = new URL(text);
        const id = url.searchParams.get('ticket');
        if (id && /^[A-Za-z0-9_-]+$/.test(id)) return id;
      } catch (e) {}

      if (/^[A-Za-z0-9_-]+$/.test(text)) return text;
      return '';
    }

    function openBridge() {
      if (bridgeWindow && !bridgeWindow.closed) return true;

      bridgeReady = false;
      bridgeWindow = window.open(
        APP_SCRIPT_URL + '?mode=bridge',
        'EVA_Google_CheckIn_Bridge'
      );

      if (!bridgeWindow) {
        showStatus(
          'Google connection was blocked by the browser. Allow pop-ups and try again.',
          'error'
        );
        return false;
      }

      showStatus('Opening Google check-in connection…');
      return true;
    }

    window.addEventListener('message', function(event) {
      // Accept responses only from the bridge window we opened.
      if (!bridgeWindow || event.source !== bridgeWindow) return;

      const data = event.data;
      if (!data || typeof data !== 'object') return;

      if (data.type === 'BRIDGE_READY') {
        bridgeReady = true;
        showStatus(
          scanning
            ? 'Google connection ready. Point the camera at a ticket.'
            : 'Google connection ready. Start the camera when ready.'
        );
        return;
      }

      if (data.type !== 'CHECKIN_RESULT') return;
      if (data.ticketID !== pendingTicketID) return;

      const result = data.result;
      pendingTicketID = '';

      if (result === 'success') {
        showStatus(
          '✓ CHECKED IN SUCCESSFULLY\nTicket ID: ' + data.ticketID,
          'success'
        );
      } else if (result === 'already') {
        showStatus(
          '⚠ ALREADY SCANNED\nThis ticket has already been checked in.\nTicket ID: ' + data.ticketID,
          'warning'
        );
      } else if (result === 'invalid') {
        showStatus(
          '✕ INVALID TICKET\nThis ticket is not valid.\nTicket ID: ' + data.ticketID,
          'error'
        );
      } else if (result === 'not_found') {
        showStatus(
          '✕ TICKET NOT FOUND\nTicket ID: ' + data.ticketID,
          'error'
        );
      } else if (result === 'busy') {
        showStatus(
          'Please wait. Another check-in is being processed.',
          'warning'
        );
      } else {
        showStatus(
          'Check-in could not be confirmed. Please retry or use manual verification.',
          'error'
        );
      }

      // Pause briefly so the same QR isn't immediately processed again.
      setTimeout(function() {
        processing = false;
        if (scanner && scanning) {
          try {
            scanner.resume();
            showStatusAfterResume();
          } catch (e) {
            showStatus('Ready for the next scan. If needed, restart the camera.');
          }
        }
      }, 1800);
    });

    function showStatusAfterResume() {
      if (!pendingTicketID && bridgeReady) {
        // Keep the last result visible while the camera is ready.
        statusBox.setAttribute('data-camera-ready', 'true');
      }
    }

    async function startScanner() {
      if (scanning) return;

      // Open the bridge directly from the button click to avoid popup blocking.
      if (!openBridge()) return;

      if (typeof Html5Qrcode === 'undefined') {
        showStatus('Scanner library failed to load. Check your connection and reload.', 'error');
        return;
      }

      startButton.disabled = true;

      try {
        scanner = new Html5Qrcode('reader');
        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1
          },
          handleScan,
          function() {}
        );

        scanning = true;
        stopButton.disabled = false;
        showStatus('Camera active. Waiting for Google connection…');

        // If the bridge has already connected, show ready state.
        if (bridgeReady) {
          showStatus('Camera active. Ready to scan a ticket.');
        }
      } catch (error) {
        scanning = false;
        startButton.disabled = false;
        stopButton.disabled = true;
        showStatus(
          'Could not start the camera. Allow camera access and try again.',
          'error'
        );
      }
    }

    async function handleScan(decodedText) {
      if (processing || !scanning) return;

      const ticketID = extractTicketID(decodedText);
      processing = true;

      try {
        scanner.pause(true);
      } catch (e) {}

      if (!ticketID) {
        showStatus('QR code detected, but it is not a recognized ticket QR.', 'error');
        setTimeout(resumeAfterInvalid, 1600);
        return;
      }

      if (!bridgeWindow || bridgeWindow.closed || !bridgeReady) {
        pendingTicketID = '';
        showStatus(
          'Google connection is not ready. Check the connection window and retry.',
          'error'
        );
        setTimeout(resumeAfterInvalid, 1800);
        return;
      }

      pendingTicketID = ticketID;
      showStatus('Checking in ticket…\nTicket ID: ' + ticketID);

      try {
        bridgeWindow.postMessage(
          { type: 'CHECKIN_REQUEST', ticketID: ticketID },
          '*'
        );

        // If the bridge never replies, unlock scanning and show an error.
        setTimeout(function() {
          if (pendingTicketID === ticketID) {
            pendingTicketID = '';
            processing = false;
            showStatus(
              'No response from Google. Check the connection window and try again.',
              'error'
            );
            try {
              if (scanner && scanning) scanner.resume();
            } catch (e) {}
          }
        }, 15000);
      } catch (error) {
        pendingTicketID = '';
        showStatus('Could not send ticket to Google. Please retry.', 'error');
        setTimeout(resumeAfterInvalid, 1800);
      }
    }

    function resumeAfterInvalid() {
      processing = false;
      if (scanner && scanning) {
        try { scanner.resume(); } catch (e) {}
      }
    }

    async function stopScanner() {
      scanning = false;
      processing = false;
      pendingTicketID = '';

      try {
        if (scanner) {
          await scanner.stop();
          scanner.clear();
        }
      } catch (e) {}

      startButton.disabled = false;
      stopButton.disabled = true;
      showStatus('Camera stopped.');
    }
  </script>
</body>
</html>
